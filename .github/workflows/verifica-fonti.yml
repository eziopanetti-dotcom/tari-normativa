name: Verifica automatica fonti TARI

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verifica-fonti-tari
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verifica le 6 fonti
        run: python verifica_fonti.py

      - name: Valida JSON
        run: python -m json.tool normativa_tari.json > /dev/null

      - name: Pubblica attestazioni aggiornate
        run: |
          if git diff --quiet -- normativa_tari.json; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add normativa_tari.json
          git commit -m "Aggiorna attestazioni fonti TARI"
          git push
